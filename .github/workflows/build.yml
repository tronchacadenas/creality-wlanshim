name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Build
        run: bash ./build.sh
      - name: Checksum
        run: sha256sum wlanapi.dll | tee wlanapi.dll.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wlanshim
          path: |
            wlanapi.dll
            wlanapi.dll.sha256
            install-shim.ps1
            README.md
